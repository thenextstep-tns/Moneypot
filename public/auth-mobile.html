<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moneypot — Google Sign In</title>
  <link rel="icon" type="image/png" href="./logo.png" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F6F4EF;
      color: #2D2A26;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 800;
      color: #1E293B;
    }
    p {
      color: #64748B;
      font-size: 14px;
      line-height: 20px;
      margin: 0 0 20px;
    }
    .spinner {
      border: 3px solid #EAE6DF;
      border-top: 3px solid #2FA36B;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #FFFFFF;
      border: 1.5px solid #D8D4CC;
      color: #2D2A26;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #F8F7F4;
    }
    .btn.primary {
      background: #2FA36B;
      border-color: #2FA36B;
      color: #FFFFFF;
      font-weight: 700;
    }
    .btn.primary:hover {
      background: #26895A;
    }
    .btn.secondary {
      background: #F8FAFC;
      border-color: #E2E8F0;
      color: #475569;
    }
    .btn.secondary:hover {
      background: #F1F5F9;
    }
    .google-icon {
      width: 18px;
      height: 18px;
    }
    .account-badge {
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 14px;
      margin: 0 0 18px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar-circle {
      width: 40px;
      height: 40px;
      border-radius: 20px;
      background: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .account-details {
      flex: 1;
      min-width: 0;
    }
    .account-name {
      font-weight: 700;
      font-size: 15px;
      color: #0F172A;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account-email {
      font-size: 12px;
      color: #64748B;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-text {
      font-size: 13px;
      color: #8A857D;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="./logo.png" alt="Moneypot" class="logo" />
    <h2 id="title">Google Sign In</h2>
    <p id="msg">Loading authentication...</p>
    
    <div class="spinner" id="loader"></div>

    <!-- Container: Fresh login button -->
    <div id="login-container" style="display: none;">
      <button class="btn" id="login-btn" onclick="startAuth()">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
      </button>
    </div>

    <!-- Container: Existing browser session prompt -->
    <div id="existing-container" style="display: none;">
      <div class="account-badge">
        <div class="avatar-circle">👤</div>
        <div class="account-details">
          <div class="account-name" id="existing-name">User</div>
          <div class="account-email" id="existing-email">user@gmail.com</div>
        </div>
      </div>
      <p style="font-size: 13px; color: #64748B; margin-bottom: 16px;">
        You're logged in with this Google account in your browser. Do you want to use this account?
      </p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn primary" id="continue-existing-btn" onclick="continueWithExisting()">
          Continue with this account
        </button>
        <button class="btn secondary" onclick="switchAccount()">
          Use a different account
        </button>
      </div>
    </div>

    <!-- Container: Return to app confirmation -->
    <div id="app-redirect-container" style="display: none;">
      <a class="btn primary" id="open-app-link" href="#" style="margin-top: 10px;">
        Open Moneypot App
      </a>
    </div>

    <div class="status-text" id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signInWithRedirect, 
      getRedirectResult, 
      onAuthStateChanged, 
      signOut,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: 'AIzaSyCGlXGlR7JgDOcCNQQmGbyEhg2mPuIZpbQ',
      authDomain: 'honeypot-834a1.firebaseapp.com',
      projectId: 'honeypot-834a1',
      appId: '1:1093994142262:web:34ae22d54101375ff69697',
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence).catch(() => {});

    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    let activeUser = null;
    let handled = false;
    let authChecked = false;

    // Safety timeout in case Firebase auth takes unusually long to respond
    const safetyTimer = setTimeout(() => {
      if (!authChecked && !handled) {
        authChecked = true;
        showLoginButton();
      }
    }, 3000);

    function buildDeepLink(user) {
      const uid = user.uid || '';
      const email = user.email || '';
      const displayName = user.displayName || email.split('@')[0] || 'Google User';
      return "moneypot://auth?uid=" + encodeURIComponent(uid) +
             "&email=" + encodeURIComponent(email) +
             "&displayName=" + encodeURIComponent(displayName);
    }

    function sendToApp(user) {
      if (!user) return;
      handled = true;
      authChecked = true;
      clearTimeout(safetyTimer);

      document.getElementById('loader').style.display = 'none';
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('existing-container').style.display = 'none';
      document.getElementById('title').innerText = "Connected!";
      document.getElementById('msg').innerText = "Signed in as " + (user.displayName || user.email);
      document.getElementById('status').innerText = "Returning to Moneypot app...";

      const target = buildDeepLink(user);
      
      const appLink = document.getElementById('open-app-link');
      appLink.href = target;
      appLink.onclick = function() {
        window.location.href = target;
      };
      document.getElementById('app-redirect-container').style.display = 'block';

      // Immediate attempt to launch deep link
      try {
        window.location.href = target;
      } catch (e) {}

      // Keep button clickable if browser blocks programmatic custom scheme navigation
      setTimeout(() => {
        document.getElementById('status').innerText = "If Moneypot didn't open automatically, tap the button above.";
      }, 1200);
    }

    function showExistingPrompt(user) {
      activeUser = user;
      authChecked = true;
      clearTimeout(safetyTimer);

      document.getElementById('loader').style.display = 'none';
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('app-redirect-container').style.display = 'none';

      document.getElementById('title').innerText = "Google Account Found";
      document.getElementById('msg').innerText = "Choose whether to continue with this account or switch.";
      document.getElementById('existing-name').innerText = user.displayName || user.email?.split('@')[0] || "Google User";
      document.getElementById('existing-email').innerText = user.email || "";
      document.getElementById('continue-existing-btn').innerText = "Continue as " + (user.displayName || user.email?.split('@')[0] || "User");

      document.getElementById('existing-container').style.display = 'block';
      document.getElementById('status').innerText = "";
    }

    function showLoginButton(statusMsg = "") {
      authChecked = true;
      clearTimeout(safetyTimer);

      document.getElementById('loader').style.display = 'none';
      document.getElementById('existing-container').style.display = 'none';
      document.getElementById('app-redirect-container').style.display = 'none';

      document.getElementById('title').innerText = "Google Sign In";
      document.getElementById('msg').innerText = "Connect with your Google account to sync your budget.";
      document.getElementById('login-container').style.display = 'block';
      document.getElementById('status').innerText = statusMsg;

      const btn = document.getElementById('login-btn');
      if (btn) btn.disabled = false;
    }

    window.continueWithExisting = function() {
      if (activeUser) {
        sendToApp(activeUser);
      }
    };

    window.switchAccount = async function() {
      document.getElementById('existing-container').style.display = 'none';
      document.getElementById('loader').style.display = 'block';
      document.getElementById('msg').innerText = "Signing out...";
      try {
        await signOut(auth);
      } catch (e) {}
      activeUser = null;
      showLoginButton("Please sign in with your other account.");
    };

    window.startAuth = async function() {
      const btn = document.getElementById('login-btn');
      if (btn) btn.disabled = true;

      document.getElementById('loader').style.display = 'block';
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('existing-container').style.display = 'none';
      document.getElementById('title').innerText = "Signing In...";
      document.getElementById('msg').innerText = "Select your Google account in the pop-up window.";
      document.getElementById('status').innerText = "";

      try {
        // Primary flow: signInWithPopup.
        // Runs via window.open + postMessage, which bypasses modern browser
        // cross-origin iframe storage partitioning on third-party authDomains!
        const result = await signInWithPopup(auth, provider);
        if (result && result.user) {
          sendToApp(result.user);
          return;
        }
      } catch (err) {
        console.warn("Popup sign-in notice:", err);
        
        if (err.code === 'auth/popup-closed-by-user') {
          showLoginButton("Sign in was cancelled. Tap below to try again.");
          return;
        }

        if (err.code === 'auth/popup-blocked') {
          document.getElementById('loader').style.display = 'none';
          document.getElementById('login-container').style.display = 'none';
          document.getElementById('title').innerText = "Pop-up Blocked";
          document.getElementById('msg').innerText = "Your browser blocked the Google sign-in window. Please choose an option:";
          document.getElementById('status').innerHTML = `
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px;">
              <button class="btn primary" onclick="startAuth()">
                Allow & Try Again
              </button>
              <button class="btn secondary" onclick="startRedirectAuth()">
                Use Redirect Instead
              </button>
            </div>
          `;
          return;
        }

        showLoginButton(err.message || "Sign in failed. Tap below to try again.");
      }
    };

    window.startRedirectAuth = function() {
      sessionStorage.setItem('in_active_redirect_flow', '1');
      localStorage.setItem('in_active_redirect_flow', '1');
      document.getElementById('loader').style.display = 'block';
      document.getElementById('status').innerText = "Redirecting to Google...";
      signInWithRedirect(auth, provider);
    };

    // Check redirect result on load
    getRedirectResult(auth)
      .then((res) => {
        if (res && res.user) {
          sessionStorage.removeItem('in_active_redirect_flow');
          localStorage.removeItem('in_active_redirect_flow');
          sendToApp(res.user);
        } else {
          initAuthState();
        }
      })
      .catch((err) => {
        console.warn("getRedirectResult info:", err);
        sessionStorage.removeItem('in_active_redirect_flow');
        localStorage.removeItem('in_active_redirect_flow');
        initAuthState();
      });

    function initAuthState() {
      const wasRedirectFlow = (sessionStorage.getItem('in_active_redirect_flow') === '1') ||
                              (localStorage.getItem('in_active_redirect_flow') === '1');
      sessionStorage.removeItem('in_active_redirect_flow');
      localStorage.removeItem('in_active_redirect_flow');

      onAuthStateChanged(auth, (user) => {
        if (handled) return;
        if (user) {
          if (wasRedirectFlow) {
            sendToApp(user);
          } else {
            showExistingPrompt(user);
          }
        } else {
          showLoginButton();
        }
      });
    }
  </script>
</body>
</html>
