<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moneypot — Google Sign In</title>
  <link rel="icon" type="image/png" href="./logo.png" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F6F4EF;
      color: #2D2A26;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 800;
      color: #1E293B;
    }
    p {
      color: #64748B;
      font-size: 14px;
      line-height: 20px;
      margin: 0 0 20px;
    }
    .spinner {
      border: 3px solid #EAE6DF;
      border-top: 3px solid #2FA36B;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #FFFFFF;
      border: 1.5px solid #D8D4CC;
      color: #2D2A26;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #F8F7F4;
    }
    .btn.primary {
      background: #2FA36B;
      border-color: #2FA36B;
      color: #FFFFFF;
      font-weight: 700;
    }
    .btn.primary:hover {
      background: #26895A;
    }
    .btn.secondary {
      background: #F8FAFC;
      border-color: #E2E8F0;
      color: #475569;
    }
    .btn.secondary:hover {
      background: #F1F5F9;
    }
    .google-icon {
      width: 18px;
      height: 18px;
    }
    .account-badge {
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 14px;
      margin: 0 0 18px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar-circle {
      width: 40px;
      height: 40px;
      border-radius: 20px;
      background: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .account-details {
      flex: 1;
      min-width: 0;
    }
    .account-name {
      font-weight: 700;
      font-size: 15px;
      color: #0F172A;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account-email {
      font-size: 12px;
      color: #64748B;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-text {
      font-size: 13px;
      color: #8A857D;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="./logo.png" alt="Moneypot" class="logo" />
    <h2 id="title">Google Sign In</h2>
    <p id="msg">Loading authentication...</p>
    
    <div class="spinner" id="loader"></div>

    <!-- Container: Fresh login button -->
    <div id="login-container" style="display: none;">
      <button class="btn" id="login-btn" type="button">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
      </button>
    </div>

    <!-- Container: Return to app confirmation -->
    <div id="app-redirect-container" style="display: none;">
      <a class="btn primary" id="open-app-link" href="#" style="margin-top: 10px;">
        Open Moneypot App
      </a>
    </div>

    <div class="status-text" id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      signOut,
      browserSessionPersistence,
      setPersistence,
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Public Firebase web config (not a secret). Restrict the key to this site in Google Cloud Console.
    const firebaseConfig = {
      apiKey: 'AIzaSyCGlXGlR7JgDOcCNQQmGbyEhg2mPuIZpbQ',
      authDomain: 'honeypot-834a1.firebaseapp.com',
      projectId: 'honeypot-834a1',
      appId: '1:1093994142262:web:34ae22d54101375ff69697',
    };

    /*
     * The Moneypot app opens this page with ?state=<random>#k=<one-time pad>.
     * We return moneypot://auth?state=<same>&ct=<Google ID token XOR pad>, so whoever receives the
     * moneypot:// link without the pad learns nothing. This page never stores Google tokens.
     */
    const SS_KEY = 'mp_auth_handoff';
    const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
    const toB64Url = (bytes) => {
      let out = '';
      for (let i = 0; i < bytes.length; i += 3) {
        const n = (bytes[i] << 16) | ((bytes[i + 1] ?? 0) << 8) | (bytes[i + 2] ?? 0);
        out += B64[(n >> 18) & 63] + B64[(n >> 12) & 63];
        if (i + 1 < bytes.length) out += B64[(n >> 6) & 63];
        if (i + 2 < bytes.length) out += B64[n & 63];
      }
      return out;
    };
    const fromB64Url = (s) => {
      const out = [];
      for (let i = 0; i < s.length; i += 4) {
        const chunk = s.slice(i, i + 4);
        let n = 0;
        for (let j = 0; j < chunk.length; j++) n |= B64.indexOf(chunk[j]) << (18 - j * 6);
        out.push((n >> 16) & 255);
        if (chunk.length > 2) out.push((n >> 8) & 255);
        if (chunk.length > 3) out.push(n & 255);
      }
      return Uint8Array.from(out);
    };

    // Read the handoff parameters once (kept per-tab so they survive a redirect sign-in),
    // then remove the pad from the address bar and history.
    const params = new URLSearchParams(location.search);
    const fragKey = new URLSearchParams(location.hash.slice(1)).get('k');
    if (params.get('state') && fragKey) {
      sessionStorage.setItem(SS_KEY, JSON.stringify({ state: params.get('state'), k: fragKey }));
      history.replaceState(null, '', location.pathname);
    }
    let handoff = null;
    try { handoff = JSON.parse(sessionStorage.getItem(SS_KEY) || 'null'); } catch (e) { handoff = null; }
    const validHandoff = Boolean(handoff && /^[A-Z0-9]{16,64}$/.test(handoff.state) && typeof handoff.k === 'string' && handoff.k.length > 100);

    const $ = (id) => document.getElementById(id);
    const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // This page only relays a credential to the app; it never keeps a long-lived session.
    setPersistence(auth, browserSessionPersistence).catch(() => {});
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    let handled = false;

    function buildDeepLink(idToken) {
      const key = fromB64Url(handoff.k);
      if (idToken.length > key.length) throw new Error('Sign-in token too long');
      const ct = new Uint8Array(idToken.length);
      for (let i = 0; i < idToken.length; i++) ct[i] = idToken.charCodeAt(i) ^ key[i];
      return 'moneypot://auth?state=' + encodeURIComponent(handoff.state) + '&ct=' + toB64Url(ct);
    }

    function showLoginButton(statusMsg) {
      show('loader', false);
      show('app-redirect-container', false);
      $('title').innerText = 'Google Sign In';
      $('msg').innerText = 'Connect with your Google account to sync your budget.';
      show('login-container', true);
      $('status').innerText = statusMsg || '';
      $('login-btn').disabled = false;
    }

    function sendToApp(user, cred) {
      if (!user || !cred || !cred.idToken) {
        showLoginButton('Google did not return a sign-in token. Please try again.');
        return;
      }
      let target;
      try {
        target = buildDeepLink(cred.idToken);
      } catch (e) {
        showLoginButton('Sign-in failed. Please start again from the app.');
        return;
      }
      handled = true;
      sessionStorage.removeItem(SS_KEY);
      show('loader', false);
      show('login-container', false);
      $('title').innerText = 'Connected!';
      $('msg').innerText = 'Signed in as ' + (user.displayName || user.email || 'your Google account');
      $('status').innerText = 'Returning to the Moneypot app…';
      $('open-app-link').href = target;
      show('app-redirect-container', true);
      window.location.href = target;
      setTimeout(() => { $('status').innerText = 'If Moneypot did not open automatically, tap the button above.'; }, 1200);
      // The app now has its own session; sign this page out.
      signOut(auth).catch(() => {});
    }

    async function startAuth() {
      $('login-btn').disabled = true;
      show('loader', true);
      show('login-container', false);
      $('title').innerText = 'Signing in…';
      $('msg').innerText = 'Choose your Google account in the pop-up window.';
      $('status').innerText = '';
      try {
        const result = await signInWithPopup(auth, provider);
        sendToApp(result.user, GoogleAuthProvider.credentialFromResult(result));
      } catch (err) {
        if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
          showLoginButton('Sign-in was cancelled. Tap below to try again.');
        } else if (err.code === 'auth/popup-blocked') {
          $('status').innerText = 'Pop-up blocked — continuing in this tab…';
          signInWithRedirect(auth, provider);
        } else {
          showLoginButton('Sign-in failed. Please try again.');
        }
      }
    }
    $('login-btn').addEventListener('click', startAuth);

    if (!validHandoff) {
      show('loader', false);
      $('title').innerText = 'Open from the app';
      $('msg').innerText = 'Start Google sign-in from the Moneypot app on your phone.';
    } else {
      getRedirectResult(auth)
        .then((res) => {
          if (res && res.user) sendToApp(res.user, GoogleAuthProvider.credentialFromResult(res));
          else if (!handled) showLoginButton();
        })
        .catch(() => showLoginButton('Sign-in failed. Please try again.'));
    }
  </script>
</body>
</html>
